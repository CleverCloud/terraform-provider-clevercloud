---
name: acceptance tests

on:
  - pull_request

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        resource:
          - addon
          - addonprovider
          - configprovider
          - application
          - database/cellar
          - database/fsbucket
          - database/materiakv
          - database/mongodb
          - database/mysql
          - database/postgresql
          - database/pulsar
          - database/redis
          - drain
          - database/elasticsearch
          - elasticsearch_cluster
          - networkgroup
          - oauth_consumer
          - software
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
    - name: Setup Terraform
      id: setup-terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false
    - name: Acceptance Tests
      # haskell is excluded here: it runs in its own job below, with a longer timeout
      run: go test $(go list ./pkg/resources/${{ matrix.resource }}/... | grep -v application/haskell) -v -timeout 15m
      env:
        TF_ACC: 1
        TF_ACC_TERRAFORM_PATH: ${{ steps.setup-terraform.outputs.terraform-path }}
        CC_OAUTH_TOKEN: ${{ secrets.CC_OAUTH_TOKEN }}
        CC_OAUTH_SECRET: ${{ secrets.CC_OAUTH_SECRET }}
        ORGANISATION: ${{ secrets.ORGANISATION }}
        CLONE_AUTH: ${{ secrets.CLONE_AUTH }}
  # Kubernetes tests run one package at a time: clusters are heavy and running them
  # together can exceed the RAM quota of the organisation. A cluster creation can
  # also wait up to 30 minutes, so the error it ends with has to fit in the timeout.
  acceptance-kubernetes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
    - name: Setup Terraform
      id: setup-terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false
    - name: Acceptance Tests (kubernetes)
      run: go test -p 1 ./pkg/resources/kubernetes/... -v -timeout 40m
      env:
        TF_ACC: 1
        TF_ACC_TERRAFORM_PATH: ${{ steps.setup-terraform.outputs.terraform-path }}
        CC_OAUTH_TOKEN: ${{ secrets.CC_OAUTH_TOKEN }}
        CC_OAUTH_SECRET: ${{ secrets.CC_OAUTH_SECRET }}
        ORGANISATION: ${{ secrets.ORGANISATION }}
        CLONE_AUTH: ${{ secrets.CLONE_AUTH }}
  # Haskell apps build very slowly (Stack compiles everything), so the test does
  # not fit in the shared 15m budget and its failure must not block the PR.
  acceptance-haskell:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
    - name: Setup Terraform
      id: setup-terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false
    - name: Acceptance Tests (haskell)
      run: go test ./pkg/resources/application/haskell/... -v -timeout 40m
      env:
        TF_ACC: 1
        TF_ACC_TERRAFORM_PATH: ${{ steps.setup-terraform.outputs.terraform-path }}
        CC_OAUTH_TOKEN: ${{ secrets.CC_OAUTH_TOKEN }}
        CC_OAUTH_SECRET: ${{ secrets.CC_OAUTH_SECRET }}
        ORGANISATION: ${{ secrets.ORGANISATION }}
        CLONE_AUTH: ${{ secrets.CLONE_AUTH }}
  sweep:
    runs-on: ubuntu-latest
    needs:
      - acceptance
      - acceptance-kubernetes
      - acceptance-haskell
    if: ${{ always() }} # run even if acceptance job fail
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
    - name: Sweepers
      if: always()
      run: make sweep
      env:
        CC_OAUTH_TOKEN: ${{ secrets.CC_OAUTH_TOKEN }}
        CC_OAUTH_SECRET: ${{ secrets.CC_OAUTH_SECRET }}
        ORGANISATION: ${{ secrets.ORGANISATION }}
        CC_ORGANISATION: ${{ secrets.CC_ORGANISATION }}

...
